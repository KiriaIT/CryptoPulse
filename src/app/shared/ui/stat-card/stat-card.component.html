<article class="stat-card" [class.stat-card--open]="expanded()">
  <button
    type="button"
    class="stat-card__trigger"
    (click)="toggle()"
    [attr.aria-expanded]="expanded()"
  >
    <span class="stat-card__label">{{ label() }}</span>
    <span class="stat-card__value">
      {{ value() }}
      @if (suffix(); as s) {
        <span class="stat-card__suffix">{{ s }}</span>
      }
    </span>
  </button>
  @if (expanded() && detail()) {
    <p class="stat-card__detail">{{ detail() }}</p>
  }
</article>
