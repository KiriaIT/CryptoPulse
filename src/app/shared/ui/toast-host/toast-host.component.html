<div
  class="fixed top-4 right-4 z-[100] flex flex-col gap-2 w-full max-w-sm pointer-events-none"
  aria-live="polite"
  aria-atomic="true"
>
  @for (toast of toasts(); track toast.id) {
    <div
      class="toast pointer-events-auto flex items-start gap-3 border rounded-xl px-4 py-3 shadow-lg backdrop-blur-sm"
      [class]="stylesFor(toast.variant)"
      role="alert"
    >
      <lucide-icon
        [img]="iconFor(toast.variant)"
        [size]="18"
        [class]="iconColorFor(toast.variant) + ' shrink-0 mt-0.5'"
        aria-hidden="true"
      />
      <p class="text-sm leading-snug flex-1 break-words">{{ toast.message }}</p>
      <button
        type="button"
        class="shrink-0 opacity-60 hover:opacity-100 transition-opacity"
        (click)="dismiss(toast.id)"
        aria-label="Dismiss notification"
      >
        <lucide-icon [img]="closeIcon" [size]="15" />
      </button>
    </div>
  }
</div>
