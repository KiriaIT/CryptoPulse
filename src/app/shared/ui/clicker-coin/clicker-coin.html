<div class="flex">
  <div class="bg-amber-400 rounded-[50%] size-20 flex items-center justify-center" (click)="onAmountIncrease()">
    <div>crypto coin</div>
  </div>
  <div class="relative h-20 w-20 flex items-center">
    <div
      class="absolute top-0 left-0 h-sm w-lg font-bold"
      [class.red]="trajectory().diff < 0"
      [class.green]="trajectory().diff >= 0"
    >
      {{ trajectory().diff >= 0 ? '+' + increaseBy() : '-' + decreaseBy() }}
    </div>
    <div class="flex-1"><b>Current Balance:</b>{{currentValue()}}</div>
  </div>
</div>
