<span class="price-ticker">
  <span class="price-ticker__price">
    @if (price() !== null) {
      {{ price() | number: '1.2-2' }}&nbsp;{{ currency() }}
    } @else {
      —
    }
  </span>

  <span
    class="price-ticker__change"
    [class.price-ticker__change--positive]="direction() === 'positive'"
    [class.price-ticker__change--negative]="direction() === 'negative'"
    aria-label="24 hour change"
  >
    @if (changePct() !== null) {
      {{ changeSign() }}{{ changePct() | number: '1.2-2' }}%
    } @else {
      —
    }
  </span>
</span>
