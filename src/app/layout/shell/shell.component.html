<div class="flex h-screen flex-col bg-background overflow-hidden">

  <!-- Unified top bar: sidebar brand + main header share one border -->
  <header class="flex shrink-0 border-b border-border bg-card">
    <div
      class="flex w-48 shrink-0 items-center gap-2.5 border-r border-border px-4 py-3"
    >
      <div class="flex h-7 w-7 shrink-0 items-center justify-center rounded-md bg-primary">
        <lucide-icon [img]="icons.LayoutDashboard" class="text-primary-foreground" [size]="14" />
      </div>
      <span class="text-sm font-semibold tracking-tight text-foreground">{{ appName }}</span>
    </div>

    <div class="flex flex-1 items-center justify-between px-6 py-3">
      <label class="flex w-72 cursor-text items-center gap-2 rounded-lg border border-border bg-secondary px-3 py-2">
        <lucide-icon [img]="icons.Search" [size]="15" class="shrink-0 text-muted-foreground" aria-hidden="true" />
        <input
          type="search"
          placeholder="Search coins, markets, wallets..."
          class="w-full bg-transparent text-sm text-foreground outline-none placeholder:text-muted-foreground"
          aria-label="Search"
        />
      </label>

      <div class="flex items-center gap-2">
        <button
          class="rounded-md p-2 text-muted-foreground transition-colors hover:bg-secondary hover:text-foreground"
          (click)="toggleTheme()"
          [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
          [attr.aria-pressed]="isDark()"
        >
          @if (isDark()) {
            <lucide-icon [img]="icons.Sun" [size]="18" />
          } @else {
            <lucide-icon [img]="icons.Moon" [size]="18" />
          }
        </button>

        <div class="relative">
          <button
            class="rounded-md p-2 text-muted-foreground transition-colors hover:bg-secondary hover:text-foreground"
            (click)="toggleNotifs()"
            aria-label="Notifications"
            [attr.aria-expanded]="showNotifs()"
          >
            <lucide-icon [img]="icons.Bell" [size]="18" />
          </button>

          @if (showNotifs()) {
            <div
              class="absolute right-0 top-11 z-50 w-72 rounded-xl border border-border bg-card shadow-lg"
              role="dialog"
              aria-label="Notifications panel"
            >
              <div class="flex items-center justify-between border-b border-border px-4 py-3">
                <span class="text-sm font-semibold text-foreground">Notifications</span>
                <button
                  class="text-muted-foreground transition-colors hover:text-foreground"
                  (click)="toggleNotifs()"
                  aria-label="Close notifications"
                >
                  <lucide-icon [img]="icons.X" [size]="15" />
                </button>
              </div>
              <div class="flex flex-col items-center justify-center px-4 py-10 text-center">
                <lucide-icon [img]="icons.Bell" [size]="32" class="mb-3 text-muted-foreground" aria-hidden="true" />
                <p class="text-sm font-medium text-foreground">No notifications</p>
                <p class="mt-1 text-xs text-muted-foreground">You're all caught up! Check back later.</p>
              </div>
            </div>
          }
        </div>

        <app-user-menu />
      </div>
    </div>
  </header>

  <div class="flex min-h-0 flex-1 overflow-hidden">
    <!-- Sidebar: nav only — vertical border aligns with header brand divider -->
    <aside class="flex w-48 shrink-0 flex-col border-r border-border bg-card">
      <nav class="flex flex-1 flex-col gap-0.5 px-2 py-3" aria-label="Main navigation">
        @for (item of navItems; track item.path + item.label) {
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-primary text-primary-foreground"
            [routerLinkActiveOptions]="{ exact: false }"
            class="flex items-center gap-2.5 rounded-md px-3 py-2 text-sm text-muted-foreground transition-colors hover:bg-secondary hover:text-foreground"
            [attr.aria-label]="item.label"
          >
            <lucide-icon [img]="item.icon" [size]="16" aria-hidden="true" />
            {{ item.label }}
          </a>
        }
      </nav>

      <div class="border-t border-border px-3 py-4">
        <p class="mb-1 text-xs text-muted-foreground">Need help?</p>
        <a
          href="https://rs.school"
          target="_blank"
          rel="noopener noreferrer"
          class="flex items-center gap-1.5 text-xs text-foreground hover:underline"
        >
          <lucide-icon [img]="icons.HelpCircle" [size]="12" aria-hidden="true" />
          Contact Support
        </a>
      </div>
    </aside>

    <main class="flex-1 overflow-y-auto bg-background">
      <router-outlet />
    </main>
  </div>
</div>
