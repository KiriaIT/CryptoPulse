<article class="flex h-full flex-col overflow-hidden rounded-2xl border border-border bg-card shadow-sm">
  <div class="h-1 w-full shrink-0" [class]="member().cardAccentClass" aria-hidden="true"></div>

  <div class="flex flex-1 flex-col p-6">
    <div class="relative">
      <img
        [src]="member().avatarUrl"
        [alt]="member().displayName + ' profile'"
        width="320"
        height="240"
        class="aspect-[4/3] w-full rounded-xl object-cover"
        [class]="member().avatarRingClass"
        loading="lazy"
      />
    </div>

    <h2 class="mt-5 text-2xl font-bold text-foreground">{{ member().displayName }}</h2>
    <p class="mt-1 text-sm font-medium text-indigo-400">{{ member().role }}</p>

    <p class="mt-5 text-xs font-medium uppercase tracking-wide text-muted-foreground">
      {{ copy.FAVORITE_PAIRS_LABEL }}
    </p>
    <ul class="mt-2 space-y-2">
      @for (pair of member().favoritePairs; track pair.symbol) {
        <li
          class="flex items-center gap-3 rounded-lg border border-border bg-secondary/60 px-3 py-2.5"
        >
          <span
            class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-indigo-500/15 text-xs font-bold text-indigo-300"
            aria-hidden="true"
          >
            {{ pair.symbol.split('/')[0] }}
          </span>
          <div class="min-w-0">
            <p class="truncate text-sm font-medium text-foreground">{{ pair.symbol }}</p>
            <p class="text-xs text-muted-foreground">{{ pair.label }}</p>
          </div>
        </li>
      }
    </ul>

    <a
      [href]="member().githubUrl"
      target="_blank"
      rel="noopener noreferrer"
      class="mt-6 self-end text-sm font-medium text-indigo-400 transition-opacity hover:opacity-80"
    >
      {{ copy.GITHUB_LINK }}
    </a>
  </div>
</article>
