<section class="relative px-6 py-8">
  <div
    class="pointer-events-none absolute inset-x-0 top-0 mx-auto h-40 max-w-2xl rounded-full bg-indigo-500/10 blur-3xl"
    aria-hidden="true"
  ></div>

  <header class="relative text-center">
    <h1 class="text-3xl font-bold text-foreground">{{ copy.TITLE }}</h1>
    <p class="mt-2 text-sm text-muted-foreground">{{ copy.SUBTITLE }}</p>
  </header>

  <div class="relative mx-auto mt-8 grid max-w-6xl grid-cols-2 gap-4 lg:grid-cols-4">
    @for (stat of highlightStats; track stat.label) {
      <div class="rounded-lg border border-border bg-card/90 p-4 backdrop-blur-sm">
        <p class="text-xs uppercase tracking-wide text-muted-foreground">{{ stat.label }}</p>
        <p class="mt-1 text-xl font-bold text-foreground">{{ stat.value }}</p>
        <p class="mt-0.5 text-xs text-muted-foreground">{{ stat.detail }}</p>
      </div>
    }
  </div>

  <div class="relative mx-auto mt-10 grid max-w-6xl grid-cols-1 gap-6 md:grid-cols-3">
    @for (member of members(); track member.id) {
      <app-team-member-card [member]="member" />
    }
  </div>

  <footer
    class="relative mx-auto mt-12 max-w-6xl rounded-2xl border border-border bg-card/90 p-6 backdrop-blur-sm md:p-8"
  >
    <div class="flex flex-col gap-8 md:flex-row md:items-center md:justify-between">
      <div>
        <p class="mb-3 text-xs font-medium uppercase tracking-wide text-muted-foreground">
          {{ copy.STACK_LABEL }}
        </p>
        <div class="flex flex-wrap gap-2">
          @for (tech of techStack; track tech) {
            <span
              class="rounded-full border border-border bg-secondary/80 px-3 py-1 text-xs font-medium text-foreground"
            >
              {{ tech }}
            </span>
          }
        </div>
      </div>

      <div class="flex flex-col items-center gap-3 md:items-end">
        <h2 class="text-lg font-semibold text-foreground">{{ copy.BUILT_FOR }}</h2>
        <a
          [href]="rsSchoolUrl"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="copy.RS_SCHOOL_ARIA"
          class="inline-block rounded-xl border border-border bg-background p-3 transition-opacity hover:opacity-80"
        >
          <img src="/favicon.png" alt="RS School" width="96" height="96" />
        </a>
      </div>
    </div>
  </footer>
</section>
