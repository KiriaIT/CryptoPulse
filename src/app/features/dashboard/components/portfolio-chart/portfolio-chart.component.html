<div class="rounded-lg border border-border bg-card p-5 h-full">
  <h2 class="text-base font-semibold text-foreground mb-4">{{ title() }}</h2>

  <svg
    viewBox="0 0 100 160"
    preserveAspectRatio="none"
    class="w-full h-40"
    [attr.aria-label]="title() + ' chart'"
    role="img"
  >
    <defs>
      <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--foreground)" stop-opacity="0.12" />
        <stop offset="100%" stop-color="var(--foreground)" stop-opacity="0" />
      </linearGradient>
    </defs>
    <path [attr.d]="fillPath" fill="url(#chartFill)" />
    <polyline
      [attr.points]="polylinePoints"
      fill="none"
      stroke="var(--foreground)"
      stroke-width="1.5"
      stroke-linejoin="round"
      stroke-linecap="round"
      vector-effect="non-scaling-stroke"
    />
  </svg>

  <div class="flex justify-between mt-2">
    @for (point of points(); track point.name) {
      <span class="text-xs text-muted-foreground">{{ point.name }}</span>
    }
  </div>
</div>
